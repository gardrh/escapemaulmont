<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escape from Chateau Maulmont</title>
  <link rel="icon" type="image/x-icon"              href="favicon/favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16"   href="favicon/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32"   href="favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="favicon/favicon-192x192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="favicon/favicon-512x512.png">
  <link rel="apple-touch-icon" sizes="180x180"      href="favicon/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="game">
  <h1 class="title">Escape from Chateau Maulmont</h1>

  <div class="castle">
    <img src="maulmont.png" alt="Chateau Maulmont" />
  </div>

  <div class="renaud-wrap">
    <img id="renaudImg" src="img/renaud0.png" alt="Renaud de Vichy" />
  </div>

  <div class="story" id="story"></div>

  <div id="langBtns" class="langBtns">
    <button onclick="selectLang('no')">🇳🇴 Norsk</button>
    <button onclick="selectLang('en')">🇬🇧 English</button>
    <button onclick="selectLang('fr')">🇫🇷 Français</button>
  </div>

  <input id="input" placeholder="Skriv svar..." />

  <div class="btnRow">
    <button id="submitBtn">SVAR</button>
    <button id="hintBtn">HINT</button>
    <button id="skipBtn" class="skip-btn">HOPP OVER</button>
  </div>

  <div id="leaderboard" class="leaderboard"></div>
</div>
<script src="game.js"></script>
</body>
</html>
